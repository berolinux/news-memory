# Drop-in for llama.service.
# Template: setup.sh fills in the install directory on the paths below.
# Render and install it with:
#   ./setup.sh --render
#   sudo cp run/llama-news-memory.conf /etc/systemd/system/llama.service.d/news-memory.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart llama.service
#
# llama.cpp then lists news_* tools in GET /tools and the Web UI.
# Env names are llama-server's own (LLAMA_ARG_*); they stack with LLAMA_OPTIONS.

[Service]
# DynamicUser must be able to read this tree and talk to Postgres.
# config.env is mode 640, group news-memory. This is merged with the
# groups llama.service already sets.
SupplementaryGroups=news-memory
ReadOnlyPaths=-@PREFIX@
# unix socket for news_memory (pg_hba local trust)
BindReadOnlyPaths=-/run/postgresql
Environment=LLAMA_ARG_MCP_SERVERS_CONFIG=@PREFIX@/data/llama-mcp.json
Environment=LLAMA_ARG_UI_CONFIG_FILE=@PREFIX@/data/ui-config.json
# 120s is already in llama-mcp.json; keep CORS on localhost (MCP default).
